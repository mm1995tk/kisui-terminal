# 中継型（relay）のプロキシ。HTTP/3 か HTTP/2 で受け、CONNECT で TCP を、CONNECT-UDP（RFC 9298）で UDP を運ぶ。
# macOS の Network.framework の nw_relay_hop_create で WKWebView に使わせ、行き先の名前解決を
# getaddrinfo ではなく自分で DNS に問い合わせて行い、IPv6 に先につなぐ（#287・#290）。
# 別のリポジトリに切り出すため、kisui-terminal のほかの crate（app/src-tauri・emulator）には依存しない。
[package]
name = "masque-proxy"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
bytes = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-resolver = "0.26"
http = "1"
quinn = { version = "0.11", default-features = false, features = [
  "log",
  "runtime-tokio",
  "rustls-ring",
] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
