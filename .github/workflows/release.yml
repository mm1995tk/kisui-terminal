name: リリース

# kisui-terminal のリリース。人が起動する（shijimi-editor の「毎日のリリース判定」は kisui-terminal を扱わない）。
#
#   gh workflow run release.yml --ref main [-f ref=<コミット>]
#
# - 版は app/src-tauri/Cargo.toml の version。版を上げるには、その version（と Cargo.lock の同じ行）を直す
#   PR をマージしてから、このワークフローを起動する。このワークフローは版を書き換えない。
# - タグは v<版>。GitHub の「Latest」の印が付く（自動更新が releases/latest/download/latest.json を見る）。
# - 同梱する shj は、そのコミットの flake.lock が指す shijimi-editor の版（nix eval --raw .#shj.version）。
#   どの版を同梱したかは Release の説明に書く。
# - AppImage・.dmg・kisui・shj・latest.json を上げるのは build.yml。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "リリースするコミット（main の上のもの）。空なら main の最新"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ver.outputs.sha }}
      version: ${{ steps.ver.outputs.version }}
      shj_version: ${{ steps.ver.outputs.shj_version }}
    steps:
      - name: main 以外では実行しない
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::main ブランチで実行してください（現在: $GITHUB_REF）"
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.11.3

      - name: 版を決める
        id: ver
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! sha=$(git rev-parse --verify --quiet "${REF:-HEAD}^{commit}"); then
            echo "::error::コミット $REF が見つかりません"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha は main の上のコミットではありません"
            exit 1
          fi
          # 後のジョブは、main のワークフローのまま、このコミットのファイルでビルドする。無ければ止める
          for f in packaging/fetch-shj.sh packaging/build-kisui.sh packaging/build-remote.sh package-lock.json app/src-tauri/tauri.conf.json; do
            if ! git cat-file -e "$sha:$f" 2>/dev/null; then
              echo "::error::$sha に $f がありません。このワークフローではリリースできない古いコミットです"
              exit 1
            fi
          done
          version=$(git show "$sha:app/src-tauri/Cargo.toml" | sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' | head -1)
          if [ -z "$version" ]; then
            echo "::error::app/src-tauri/Cargo.toml から X.Y.Z 形式の version を読めませんでした"
            exit 1
          fi
          # 同梱する shj の版は、そのコミットの flake.lock が指す shijimi-editor のもの
          shj_version=$(nix eval --raw "git+file://$PWD?rev=$sha#shj.version")
          if [[ ! "$shj_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::同梱する shj の版を X.Y.Z 形式で読めませんでした: $shj_version"
            exit 1
          fi
          # 同じ版を別のコミットで出し直さない（同じコミットの再実行は、アセットを上げ直すだけなので許す）
          tag="v$version"
          if remote=$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag" | tail -1 | cut -f1) && [ -n "$remote" ] && [ "$remote" != "$sha" ]; then
            echo "::error::タグ $tag はもう別のコミット（$remote）にあります。app/src-tauri/Cargo.toml の version を上げてください"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "shj_version=$shj_version"
          } >> "$GITHUB_OUTPUT"
          echo "kisui-terminal $version（shj $shj_version を同梱）を $sha からリリースする"

  build:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      shj_version: ${{ needs.prepare.outputs.shj_version }}
      tag: v${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN_RELEASE: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_RELEASE }}
