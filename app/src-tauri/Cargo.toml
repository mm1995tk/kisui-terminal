[package]
name = "kisui-terminal"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "kisui-terminal (Tauri shell), the terminal-centered workspace that works closely with shijimi-editor"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
# 版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# 設定ファイルの [[gui.machines]]（config.rs）。版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
toml = "=1.1.8"
# SHA-256。版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
sha2 = "=0.10.9"
# 自動更新（C8）。AppImage と .dmg の版だけが feature `updater` で入れる。Nix で作る版は入れない（更新は nix flake update で行う）
tauri-plugin-updater = { version = "=2.14.0", optional = true }
# OS の通知（notify.rs。ターミナルの OSC 99）。押された・閉じられたを取るため、公式の通知プラグインでなく直接使う。版は Cargo.lock にすでにあるものに合わせる
notify-rust = "=4.18.2"
# OS のクリップボード（ターミナルの OSC 5522）。版は npm の @tauri-apps/plugin-clipboard-manager に合わせる
tauri-plugin-clipboard-manager = "=2.5.0"
# ファイル転送（transfer.rs）の openat・O_NOFOLLOW。版は Cargo.lock にすでにある（tauri などが使っている）ものに合わせる
libc = "=0.2.191"
# kisui-terminal の外からクリップボードの履歴を開く全体のキー（clipboard_popup.rs）。macOS は Carbon の RegisterEventHotKey、
# Linux は X11 の XGrabKey で取る（macOS のアクセシビリティの許可は要らない）
tauri-plugin-global-shortcut = "=2.4.1"

# クリップボードの履歴（clipboard_history.rs）。macOS は NSPasteboard の changeCount と型の一覧を見る。
# 外から開く履歴の窓（clipboard_popup.rs）は、前にいたアプリを NSWorkspace で覚えて NSRunningApplication で戻し、
# 窓を NSWindow でキーの窓にしてから NSApplication で前に出す。
# 版は Cargo.lock にすでにある（arboard が使っている）ものに合わせる
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSApplication",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

# クリップボードの履歴（clipboard_history.rs）。Linux は文字を arboard で読み、「秘密」の印を wl-clipboard-rs（Wayland）か
# x11rb（X11）で確かめる。版は Cargo.lock にすでにある（tauri-plugin-clipboard-manager が使っている）ものに合わせる
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.7.0", default-features = false }
wl-clipboard-rs = "=0.9.5"
x11rb = "=0.13.2"

[features]
# release の画面は埋め込んだ Web を使う（これが無いと devUrl を見に行く）。cargo tauri build は自動で付ける
custom-protocol = ["tauri/custom-protocol"]
# 自動更新。リリースの workflow（.github/workflows/build.yml）だけが付ける
updater = ["dep:tauri-plugin-updater"]
