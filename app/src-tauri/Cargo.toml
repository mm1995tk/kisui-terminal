[package]
name = "kisui-terminal"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "kisui-terminal (Tauri shell), the terminal-centered workspace that works closely with shijimi-editor"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# macos-private-api：外から開くクリップボードの履歴の窓を透明にして角を丸く見せる（tauri.conf.json の macOSPrivateApi と揃える）
# unstable：内蔵ブラウザのタブ（browser.rs）を、子の webview としてメイン窓に重ねる（Window::add_child）
# devtools：内蔵ブラウザのタブのページの DevTools（リーダーの `o i`。#205）を release でも開く。macOS では Apple の非公開の API を使う
# （App Store では配らないので問題ない）。メイン窓と履歴の窓では、release では切る（main.rs の context・clipboard_popup.rs）
tauri = { version = "=2.12.4", features = [
  "macos-private-api",
  "unstable",
  "devtools",
] }
# 版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# 設定ファイルの [[gui.machines]]（config.rs）。版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
toml = "=1.1.8"
# 選んだキャラクターを config.local.toml に書くとき、ほかの項目とコメントを壊さない（config.rs の write_mascot_name）。版は Cargo.lock にすでにあるものに合わせる
toml_edit = "=0.25.17"
# SHA-256。版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
sha2 = "=0.10.9"
# 自動更新（C8）。AppImage と .dmg の版だけが feature `updater` で入れる。Nix で作る版は入れない（更新は nix flake update で行う）
tauri-plugin-updater = { version = "=2.14.0", optional = true }
# OS の通知（notify.rs。ターミナルの OSC 99）。押された・閉じられたを取るため、公式の通知プラグインでなく直接使う。版は Cargo.lock にすでにあるものに合わせる
notify-rust = "=4.18.2"
# OS のクリップボード（ターミナルの OSC 5522）。版は npm の @tauri-apps/plugin-clipboard-manager に合わせる
tauri-plugin-clipboard-manager = "=2.5.0"
# ファイル転送（transfer.rs）の openat・O_NOFOLLOW。版は Cargo.lock にすでにある（tauri などが使っている）ものに合わせる
libc = "=0.2.191"
# kisui-terminal の外からクリップボードの履歴を開く全体のキー（clipboard_popup.rs）。macOS は Carbon の RegisterEventHotKey、
# Linux は X11 の XGrabKey で取る（macOS のアクセシビリティの許可は要らない）
tauri-plugin-global-shortcut = "=2.4.1"
# 公開サフィックスの一覧（Public Suffix List）をコードに埋め込んだもの。`[gui.browser] passkey_sites` の `.google.com` の書き方で、
# 誰でもサブドメインを持てる名前（`.com`・`.github.io`）を使わないため（config.rs）。一覧は crate の版を上げると新しくなる
psl = "=2.1.245"

# クリップボードの履歴（clipboard_history.rs）。macOS は NSPasteboard の changeCount と型の一覧を見る。
# 外から開く履歴の窓（clipboard_popup.rs）は、窓を NSPanel（NonactivatingPanel）に替えて、アプリを前に出さずに
# キーの窓にする。
# 内蔵ブラウザの DevTools（browser.rs の open_devtools。#205）は、Inspector をくっつける先にする隠した NSView を作る。
# 版は Cargo.lock にすでにある（arboard が使っている）ものに合わせる
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSPanel",
  "NSPasteboard",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSString",
] }
# 内蔵ブラウザのタブの favicon（favicon.rs。#237）。ページの外の世界（WKContentWorld）でスクリプトを動かし、答えを受ける。
# 版は Cargo.lock にすでにある（wry が使っている）ものに合わせる
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "block2",
  "WKWebView",
  "WKContentWorld",
  "WKFrameInfo",
  # 内蔵ブラウザのプロキシ（browser_proxy.rs。#294）：データストアに中継の設定を当て、シークレットのタブの設定を作る
  "WKWebsiteDataStore",
  "WKWebViewConfiguration",
] }
block2 = "=0.6.2"
# 内蔵ブラウザを通す中継型のプロキシ（browser_proxy.rs。#294）。同じ workspace の独立した crate
masque-proxy = { path = "../../masque-proxy" }
# 内蔵ブラウザのプロキシ（browser_proxy.rs。#294）の鍵と証明書をログインのキーチェーンに置き、証明書を SSL・localhost に限って
# 信頼させ、信頼されているかを確かめる。版は Cargo.lock にすでにある（rustls-platform-verifier が使っている）ものに合わせる
security-framework = "=3.7.0"
core-foundation = "=0.10.1"
# 内蔵ブラウザのプロキシ（browser_proxy.rs）を初めてのタブで 1 度だけ用意し、メインスレッドの答えを待つ。
# 版は Cargo.lock にすでにある（tauri が使っている）ものに合わせる
tokio = { version = "=1.53.3", features = ["sync"] }

# クリップボードの履歴（clipboard_history.rs）。Linux は文字を arboard で読み、「秘密」の印を wl-clipboard-rs（Wayland）か
# x11rb（X11）で確かめる。版は Cargo.lock にすでにある（tauri-plugin-clipboard-manager が使っている）ものに合わせる
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.7.0", default-features = false }
wl-clipboard-rs = "=0.9.5"
x11rb = "=0.13.2"
# 内蔵ブラウザ（browser.rs・download.rs）。ページの window.close() と、ダウンロードを WebKitGTK から直接受ける
# （wry はどちらも殻に知らせない。wry のダウンロードの受け口は、Cookie を共有するタブの数だけ重なる）。
# 版は Cargo.lock にすでにある（wry が使っている）ものに合わせる
# favicon（favicon.rs。#237）は、ページの外の世界でスクリプトを動かして答えを受ける（call_async_javascript_function。WebKitGTK 2.40 から）
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"

[features]
# release の画面は埋め込んだ Web を使う（これが無いと devUrl を見に行く）。cargo tauri build は自動で付ける
custom-protocol = ["tauri/custom-protocol"]
# 自動更新。リリースの workflow（.github/workflows/build.yml）だけが付ける
updater = ["dep:tauri-plugin-updater"]
